name: 🌇 BSJP Screener (15:45 WIB)

on:
  workflow_dispatch:  # Trigger manual
  schedule:
    # 08:45 UTC = 15:45 WIB, Senin–Jumat
    - cron: '45 8 * * 1-5'

permissions:
  contents: write

jobs:
  bsjp-screener:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: ⚙️ Setup Environment Secrets
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "TELEGRAM_MESSAGE_THREAD_ID=${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}" >> .env
          echo "BSJP_BOT_TOKEN=${{ secrets.BSJP_BOT_TOKEN }}" >> .env
          echo "BSJP_CHAT_ID=${{ secrets.BSJP_CHAT_ID }}" >> .env
          echo "BSJP_THREAD_ID=${{ secrets.BSJP_THREAD_ID }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "LLM_PROVIDER=gemini" >> .env
          echo "SUPABASE_PROJECT_ID=${{ secrets.SUPABASE_PROJECT_ID }}" >> .env
          echo "SUPABASE_API_KEY=${{ secrets.SUPABASE_API_KEY }}" >> .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "GOAPI_KEY=${{ secrets.GOAPI_KEY }}" >> .env
          echo "DAY_TRADE_MODE=true" >> .env
          echo "DATA_PROVIDER=yfinance" >> .env
          echo "DATABASE_URL=sqlite+aiosqlite:///./idx_signal_bot.db" >> .env
          echo "DATABASE_URL_SYNC=sqlite:///./idx_signal_bot.db" >> .env

      - name: 🌇 Run BSJP Screener
        run: python run_bsjp_now.py

      - name: 💾 Commit & Push Database Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add idx_signal_bot.db || true
          git commit -m "Auto-update DB from BSJP Screener [skip ci]" || true
          git push || true

